# 每周从各仓库拉 commit 数与代码行，重新生成 README.md
# 私有仓库统计需要 METRICS_TOKEN secret（PAT: repo / read:org）；没有则回退到 data/stats.json 里的缓存
name: Build README
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.template.md
      - diagrams/**
      - data/projects.json
      - scripts/build_readme.py
      - .github/workflows/build-readme.yml
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install tokei
        uses: taiki-e/install-action@v2
        with:
          tool: tokei
      - name: Install d2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s -- --prefix "$HOME/.local"
      - name: Render diagrams
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          d2 --theme 0 --dark-theme 200 diagrams/acghub.d2 assets/architecture.svg
      - name: Build README
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_readme.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md data/stats.json assets/architecture.svg assets/languages-light.svg assets/languages-dark.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: rebuild README"
          git pull --rebase origin main
          git push
