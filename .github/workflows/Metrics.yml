# lowlighter/metrics：按语言统计所有仓库（含私有与组织仓库）的代码量
# 需要 METRICS_TOKEN secret（PAT，scope: repo, read:org, read:user），
# 没有时回退到 GITHUB_TOKEN，只能统计公开仓库。
name: Metrics
on:
  schedule: [{cron: "0 18 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: yenharvey
          template: classic
          filename: metrics.languages.svg
          base: ""
          config_timezone: Asia/Shanghai
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, shell, makefile, dockerfile, json, yaml
          plugin_lines: yes
          plugin_lines_sections: base
